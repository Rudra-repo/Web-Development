<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container {
            width: 2300px;
            height: 300px;
            background-color: aqua;
            display: flex;
            justify-content: center;
        }

            font-style: bold;
        }
        .box1 {
            background-color: coral;
            height: 150px;
            width: 150px;
            margin: 50px;
            justify-content: space-around;
            text-align: center;
            order: 5;
            flex-shrink: 1;
        }
        .box2 {
            background-color: coral;
            height: 150px;

            margin: 50px;

</html>
