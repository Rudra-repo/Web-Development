<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container {
            height: 1000px;
            
            background-color: aqua;
            display: flex;
            justify-content: center;
        }
        h1 {
            text-align: center;
            font-style: bold;
        }
        .box1 {
            background-color: coral;
            height: 150px;
            width: 150px;
            margin: 50px;
            justify-content: space-around;
            text-align: center;
            order: 5;
            flex-shrink: 1;
        }
        .box2 {
            background-color: coral;
            height: 150px;
            width: 150px;
            margin: 50px;
            justify-content: space-around;
            text-align: center;
            order: 3;
            flex-shrink: 0;
        }
        .box3 {
            background-color: coral;
            height: 150px;
            width: 150px;
            margin: 50px;
            justify-content: center;
            text-align: center;
            order: 17;
            flex-shrink: 2;
        }
        .box4 {
            background-color: coral;
            height: 150px;
            width: 150px;
            margin: 50px;
            justify-content: center;
            text-align: center;
            flex-shrink: 1;
            order: 13;
        }
    </style>
</head>
<body>
    <h1> Flex Properties for Child elements </h1>
    <div class="container">
        <div class="box1">Box1</div>
        <div class="box2">Box2</div>
        <div class="box3">Box3</div>
        <div class="box4">Box4</div>
    </div>
</body>
</html>
