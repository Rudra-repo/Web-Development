<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Properties</title>
    <style>
        *{
      background-color: pink;
    }
    .container{
      background-color: green;
      height: 800px;
      width: 900px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 3fr 5fr;
      grid-template-rows: 1fr 3fr 5fr;
    }
    .box{
      background-color: red;
      margin: 10px;
    }

    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
    </div>
</body>
</html>
