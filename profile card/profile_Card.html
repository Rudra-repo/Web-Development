<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="profile">
      <img
        src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_640.png"
        alt="Profile Picture"
        class="profile-img"
      />
      <p class="name">Rahul Verma</p>
    </div>

    <div class="info">
      <p class="desc">
        Web Designer & JavaScript Enthusiast. Loves clean, creative layouts and good coffee!
      </p>
      <div class="buttons">
        <button class="btn">Contact</button>
        <button class="btn">Portfolio</button>
      </div>
    </div>
  </div>
</body>
</html>
